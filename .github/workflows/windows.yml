# Compile Spatial3D pour Windows à chaque push et publie un zip prêt à l'emploi
# (onglet Actions > dernière exécution > Artifacts > Spatial3D-win64)
name: Windows

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: FFmpeg (BtbN, LGPL, DLL)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Derniere version stable disponible (le nom des fichiers change a chaque version de FFmpeg)
          $rel = Invoke-RestMethod -Headers @{ Authorization = "Bearer $env:GH_TOKEN" } https://api.github.com/repos/BtbN/FFmpeg-Builds/releases/latest
          $asset = $rel.assets | Where-Object { $_.name -match '^ffmpeg-n[\d.]+-latest-win64-lgpl-shared-[\d.]+\.zip$' } |
                   Sort-Object name -Descending | Select-Object -First 1
          if (-not $asset) { $asset = $rel.assets | Where-Object { $_.name -eq 'ffmpeg-master-latest-win64-lgpl-shared.zip' } }
          Write-Host "FFmpeg : $($asset.name)"
          Invoke-WebRequest $asset.browser_download_url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath deps
          Get-ChildItem deps -Directory | Select-Object -First 1 | Rename-Item -NewName ffmpeg

      - name: libmysofa (HRTF mesurées)
        run: vcpkg install libmysofa:x64-windows

      - name: Configuration
        shell: pwsh
        run: >
          cmake -S . -B build -A x64
          -DFFMPEG_ROOT="${{ github.workspace }}/deps/ffmpeg"
          -DS3D_WITH_MYSOFA=ON
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Compilation
        run: cmake --build build --config Release

      - name: Tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Paquet
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item build/Release/Spatial3D.exe, build/Release/spatial3d-cli.exe, build/Release/*.dll dist/
          Get-ChildItem "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows" -Recurse -Filter *.sofa |
            Copy-Item -Destination dist/
          Copy-Item README.md, Spatial3D-lancer.bat, Spatial3D-temps-reel.bat dist/

      - uses: actions/upload-artifact@v4
        with:
          name: Spatial3D-win64
          path: dist

      # Release automatique : quand la version de CMakeLists.txt n'a pas encore de tag, on cree
      # le tag vX.Y.Z et la Release avec le zip Windows pret a l'emploi.
      - name: Version
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path CMakeLists.txt -Pattern 'project\(Spatial3D VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          $exists = git ls-remote --tags origin "refs/tags/v$v"
          "version=$v" >> $env:GITHUB_OUTPUT
          "new=$(if ($exists) { 'false' } else { 'true' })" >> $env:GITHUB_OUTPUT
          Write-Host "Version $v - nouvelle : $(-not $exists)"

      - name: Zip de la release
        if: github.ref == 'refs/heads/main' && steps.ver.outputs.new == 'true'
        shell: pwsh
        run: Compress-Archive -Path dist/* -DestinationPath "Spatial3D-v${{ steps.ver.outputs.version }}-win64.zip"

      - name: Release GitHub
        if: github.ref == 'refs/heads/main' && steps.ver.outputs.new == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Spatial3D v${{ steps.ver.outputs.version }}
          files: Spatial3D-v${{ steps.ver.outputs.version }}-win64.zip
          body: |
            Spatial3D pour Windows (64 bits) - BJMPC Informatique.

            **Installation rapide**
            1. Pour le mode temps reel, installez VB-Cable (https://vb-audio.com/Cable/) puis redemarrez.
            2. Decompressez le zip et lancez `Spatial3D.exe`.

            Ou depuis les sources : double-clic sur `build-windows.bat` (installe tout et cree les raccourcis).
